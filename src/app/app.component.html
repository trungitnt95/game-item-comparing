<router-outlet></router-outlet>
<div *ngIf="SCREEN_MODE.LIST === currentMode">
  <!-- Button trigger modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
    Compare items
  </button>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <select [(ngModel)]="selectedGroup" (change)="changeGroup(selectedGroup)" class=" form-control custom-select">
            <option selected [value] = "SKYRIM_GROUP.HELMET">Helmet</option>
            <option [value] = "SKYRIM_GROUP.GOO2">Hammer</option>
          </select>
          <br/>
          <div class="w-100 d-flex">
            <div class="col-6 p-r-5px">
              <select [(ngModel)]="selectedItemID1" (change)="showSelectedItem1()" class="w-100 form-control custom-select">
                <option selected [value] = "null">Open this select menu</option>
                <option *ngFor="let items1 of selectedGroupData" [value]="items1['id']" [id]="items1['id']">{{items1['id'] + ' - ' + items1['name']}}</option>
              </select>
            </div>
            <div class="col-6 p-l-5px">
              <select [(ngModel)]="selectedItemID2" (change)="showSelectedItem2()" class="w-100 form-control custom-select">
                <option selected [value] = "null">Open this select menu</option>
                <option *ngFor="let items2 of selectedGroupData" [value]="items2['id']" [id]="items2['id']">{{items2['id'] + ' - ' + items2['name']}}</option>
              </select>
            </div>
          </div>
          <br/>
          <button class="w-100 btn btn-outline-success" (click)="compare()">Compare</button>
        </div>
      </div>
    </div>
  </div>

  <br/>
  <br/>
  <table class="table table-striped table-borderless">
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let item of dataList">
      <td>{{item['id']}}</td>
      <td>{{item['name']}}</td>
      <td></td>
    </tr>
    </tbody>
  </table>
</div>
