<div *ngIf="selectedScheduled">
  <hr>
  <h1>{{selectedScheduled.scheduleName}}</h1>

  <p>{{selectedScheduled.type}}</p>
  <p>{{selectedScheduled.age}}</p>
  <p>{{selectedScheduled.gender}}</p>

  <hr/>

  <div class="d-flex" *ngFor="let food of selectedFoodInScheduled">
    <div class="flex-2">{{food.name}}</div>
    <div class="flex-1">{{food.numberOf100Gram}}x100gam</div>
  </div>
  <button class="btn btn-success" (click)="showAddFoodPanel()">+</button>
  <div *ngIf="isShowAddingFood">
    <select [(ngModel)]="selectedGroup" (change)="onSelectedGroup()" class="w-100 form-control custom-select">
      <option selected [value] = "undefined">Open this select menu</option>
      <option *ngFor="let items1 of [Group[Group.RICE],Group[Group.proteins]] " [value]="items1">{{items1}}</option>
    </select>

    <select [(ngModel)]="selectedFoodId" (change)="onSelectedFood()" class="w-100 form-control custom-select">
      <option selected [value] = "undefined">Open this select menu</option>
      <option *ngFor="let food of listFood" [value]="food.key">{{food.name}}</option>
    </select>

    <input type="number" [(ngModel)]="numberOf100Gram"/>
    <button (click)="hideAddingFood()">cancel</button>
    <button (click)="addSelectedFoodToSchedule()">ok</button>
  </div>

  <hr/>
  <button *ngIf="nutrisFromMaster !== selectedFoodInScheduled.length" class="btn btn-outline-danger" (click)="startAnalyze()">Get data & Calculate</button>
  <div *ngIf="nutrisFromMaster === selectedFoodInScheduled.length">
    <h1>Avg calculation / day:</h1>
    <div *ngFor="let attribute of nutriAttributeNames" class="d-flex" >
      <div class="flex-1">{{attribute}}</div>
      <div class="flex-1">{{result[attribute] > -1 ? result[attribute] : '-'}}</div>
    </div>
  </div>

</div>
