  <div class="main-compare m-2 w-100">
    <div class="w-100 d-flex">
      <div #compare class="col-12">

          <app-compare-selector [selectedItemID1]="selectedItemID1" [selectedItemID2]="selectedItemID2"></app-compare-selector>

        <app-both-item-value displayText="Perl" fieldName="perl" [selectedItem1]="selectedItem1" [selectedItem2]="selectedItem2" e></app-both-item-value>
